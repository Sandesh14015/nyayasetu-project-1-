kind = "web"
previewPath = "/"
title = "NyayaSetu AI"
version = "1.0.0"
id = "artifacts/nyayasetu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18910

[services.development]
run = "pnpm --filter @workspace/nyayasetu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nyayasetu", "run", "build" ]
publicDir = "artifacts/nyayasetu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18910"
BASE_PATH = "/"
